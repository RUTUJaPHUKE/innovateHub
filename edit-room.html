<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Room - Room Finder</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9fafe;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #4a63f0;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #4a63f0;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #394ed3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Edit Room</h2>
    <form id="editForm">
      <label for="location">Location (City)</label>
      <input type="text" id="location" required>

      <label for="address">Full Address</label>
      <input type="text" id="address" required>

      <label for="rent">Rent (₹)</label>
      <input type="number" id="rent" required>

      <label for="deposit">Deposit (₹)</label>
      <input type="number" id="deposit" required>

      <label for="type">Room Type</label>
      <select id="type" required>
        <option value="PG">PG</option>
        <option value="1BHK">1BHK</option>
        <option value="2BHK">2BHK</option>
      </select>

      <label for="gender">Preferred Gender</label>
      <select id="gender" required>
        <option value="Any">Any</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="amenities">Amenities (comma separated)</label>
      <input type="text" id="amenities">

      <label for="image">Image URL</label>
      <input type="url" id="image" required>

      <button type="submit">Update Room</button>
    </form>
  </div>

  <script>
    const index = localStorage.getItem("editRoomIndex");
    const rooms = JSON.parse(localStorage.getItem("roomListings")) || [];

    if (index === null || !rooms[index]) {
      alert("Room not found.");
      window.location.href = "post-room.html";
    }

    const room = rooms[index];
    document.getElementById("location").value = room.location;
    document.getElementById("address").value = room.address;
    document.getElementById("rent").value = room.rent;
    document.getElementById("deposit").value = room.deposit;
    document.getElementById("type").value = room.type;
    document.getElementById("gender").value = room.gender;
    document.getElementById("amenities").value = room.amenities;
    document.getElementById("image").value = room.image;

    document.getElementById("editForm").addEventListener("submit", function(e) {
      e.preventDefault();
      room.location = document.getElementById("location").value;
      room.address = document.getElementById("address").value;
      room.rent = document.getElementById("rent").value;
      room.deposit = document.getElementById("deposit").value;
      room.type = document.getElementById("type").value;
      room.gender = document.getElementById("gender").value;
      room.amenities = document.getElementById("amenities").value;
      room.image = document.getElementById("image").value;

      rooms[index] = room;
      localStorage.setItem("roomListings", JSON.stringify(rooms));
      alert("Room updated successfully!");
      window.location.href = "post-room.html";
    });
  </script>
</body>
</html>
