<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - Room Finder</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
    }
    .profile-box {
      background: white;
      margin: 50px auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      max-width: 500px;
      text-align: center;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    button {
      padding: 12px;
      width: 100%;
      background: #4a63f0;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #394ed3;
    }
    .logout {
      margin-top: 20px;
      background: #e74c3c;
    }
    .logout:hover {
      background: #c0392b;
    }
    .profile-image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="profile-box">
    <h2>Your Profile</h2>
    <img id="profilePreview" class="profile-image" src="" alt="Profile Picture" />
    <form id="profileForm">
      <label for="photo">Profile Photo URL</label>
      <input type="url" id="photo" placeholder="Image URL (optional)" />

      <label for="displayName">Display Name</label>
      <input type="text" id="displayName" placeholder="Your name" required />

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Your full address" required />

      <button type="submit">Save Profile</button>
    </form>

    <button class="logout" onclick="logoutUser()">Logout</button>
  </div>

  <script>
    let currentUserRaw = localStorage.getItem("currentUser");
    if (!currentUserRaw) {
      alert("Please login first.");
      window.location.href = "login.html";
    }

    let currentUser;
    try {
      currentUser = JSON.parse(currentUserRaw);
    } catch (e) {
      alert("User session is corrupted. Please login again.");
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }

    const profileForm = document.getElementById("profileForm");
    const photoInput = document.getElementById("photo");
    const nameInput = document.getElementById("displayName");
    const addressInput = document.getElementById("address");
    const profilePreview = document.getElementById("profilePreview");

    // Load existing profile if exists
    const savedProfile = JSON.parse(localStorage.getItem("profile_" + currentUser.username)) || {};
    photoInput.value = savedProfile.photo || "";
    nameInput.value = savedProfile.displayName || "";
    addressInput.value = savedProfile.address || "";

    if (savedProfile.photo) {
      profilePreview.src = savedProfile.photo;
      profilePreview.style.display = "block";
    }

    profileForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const updated = {
        photo: photoInput.value,
        displayName: nameInput.value,
        address: addressInput.value
      };
      localStorage.setItem("profile_" + currentUser.username, JSON.stringify(updated));
      alert("Profile updated successfully!");
      if (updated.photo) {
        profilePreview.src = updated.photo;
        profilePreview.style.display = "block";
      } else {
        profilePreview.style.display = "none";
      }
    });

    function logoutUser() {
      localStorage.removeItem("currentUser");
      alert("Logged out successfully.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
