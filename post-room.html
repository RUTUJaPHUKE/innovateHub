<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post a Room - Room Finder</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9fafe;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #4a63f0;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #4a63f0;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #394ed3;
    }

    .listings-box {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .room-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .room-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }
    .room-card h3 {
      margin: 10px 0 5px;
    }
    .room-card p {
      margin: 5px 0;
    }
    .room-card button {
      width: auto;
      padding: 8px 16px;
      margin: 10px 10px 0 0;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Post a New Room</h2>
    <form id="roomForm">
      <label for="location">Location (City)</label>
      <input type="text" id="location" required>

      <label for="address">Full Address</label>
      <input type="text" id="address" required>

      <label for="rent">Rent (₹)</label>
      <input type="number" id="rent" required>

      <label for="deposit">Deposit (₹)</label>
      <input type="number" id="deposit" required>

      <label for="type">Room Type</label>
      <select id="type" required>
        <option value="">-- Select --</option>
        <option>PG</option>
        <option>1BHK</option>
        <option>2BHK</option>
      </select>

      <label for="gender">Preferred Gender</label>
      <select id="gender" required>
        <option value="">-- Select --</option>
        <option>Any</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label for="amenities">Amenities (comma separated)</label>
      <input type="text" id="amenities">

      <label for="image">Image URL</label>
      <input type="url" id="image" required>

      <button type="submit">Submit Room</button>
    </form>
  </div>

  <!-- Display user's posted rooms -->
  <section class="listings-box">
    <h2 style="text-align:center;">Your Posted Rooms</h2>
    <div id="myRooms">Loading your rooms...</div>
  </section>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
      alert('Please login to post a room.');
      window.location.href = 'login.html';
    }

    // Handle room posting
    const form = document.getElementById('roomForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const room = {
        location: document.getElementById('location').value,
        address: document.getElementById('address').value,
        rent: document.getElementById('rent').value,
        deposit: document.getElementById('deposit').value,
        type: document.getElementById('type').value,
        gender: document.getElementById('gender').value,
        amenities: document.getElementById('amenities').value,
        image: document.getElementById('image').value,
        postedBy: currentUser.username,
        available: true,
        bookedBy: null
      };

      const existingRooms = JSON.parse(localStorage.getItem('roomListings')) || [];
      existingRooms.push(room);
      localStorage.setItem('roomListings', JSON.stringify(existingRooms));

      alert('Room posted successfully!');
      window.location.href = 'roomfinder.html';
    });

    // Load and display rooms posted by current user
    const allRooms = JSON.parse(localStorage.getItem("roomListings")) || [];
    const myRooms = allRooms.filter(room => room.postedBy === currentUser.username);
    const myRoomsDiv = document.getElementById("myRooms");

    if (myRooms.length === 0) {
      myRoomsDiv.textContent = "You have not posted any rooms yet.";
    } else {
      myRoomsDiv.innerHTML = "";
      myRooms.forEach((room, index) => {
        const roomIndex = allRooms.indexOf(room);
        const card = document.createElement("div");
        card.className = "room-card";
        card.innerHTML = `
          <img src="${room.image}" alt="Room Image">
          <h3>${room.type} in ${room.location}</h3>
          <p><strong>Address:</strong> ${room.address}</p>
          <p><strong>Rent:</strong> ₹${room.rent} | <strong>Deposit:</strong> ₹${room.deposit}</p>
          <p><strong>Status:</strong> ${room.available ? "Available" : "Booked"}</p>
        `;

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.onclick = () => {
          localStorage.setItem("editRoomIndex", roomIndex);
          window.location.href = "edit-room.html";
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => {
          if (confirm("Are you sure you want to delete this room?")) {
            allRooms.splice(roomIndex, 1);
            localStorage.setItem("roomListings", JSON.stringify(allRooms));
            location.reload();
          }
        };

        card.appendChild(editBtn);
        card.appendChild(deleteBtn);
        myRoomsDiv.appendChild(card);
      });
    }
  </script>
   <nav>
      <a href="roomfinder.html">Home</a>
      </nav>

</body>
</html>
